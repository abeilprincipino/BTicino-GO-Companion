version: "2"
run:
  concurrency: 4
  timeout: 5m
  tests: true
  go: "1.26"

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - reassign
    - gocritic
    - revive
    - wsl_v5
    - whitespace
    - godot
    - misspell
    - dupword
    - predeclared
    - errname
    - asciicheck
    - funlen
    - perfsprint
    - unconvert
    - ineffassign
    - gosec
    - bidichk
    - bodyclose
    - fatcontext
    - sqlclosecheck
    - rowserrcheck
    - sloglint
    - loggercheck
    - testifylint
    - thelper
    - usetesting
    - modernize
    - exptostd
    - intrange
    - usestdlibvars
    - nolintlint

  disable:
    - lll
    - prealloc
    - wrapcheck
    - err113
    - mnd
    - iface
    - nakedret
    - noinlineerr
    - gocognit
    - cyclop
    - depguard
    - goheader
    - importas
    - funcorder
    - godoclint
    - varnamelen
    - exhaustruct
    - gochecknoglobals
    - gochecknoinits
    - unparam
    - makezero
    - testpackage
    - embeddedstructfieldcheck
    - iotamixing
    - unqueryvet
    - recvcheck
    - mirror
    - protogetter
    - spancheck
    - zerologlint

  exclusions:
    paths:
      - vendor$
      - third_party$
      - testutils$
      - examples$
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - gosec
      - text: "G304"
        linters:
          - gosec

  settings:
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 240
      statements: 240
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

formatters:
  enable:
    - gofmt
    - gofumpt
  disable:
    - gci
    - goimports
    - golines
    - swaggo
  settings:
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

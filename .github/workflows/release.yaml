name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create on the selected branch (beta from develop: v0.12.0-beta.1, release from main: v0.12.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve the tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')"
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::Tag '$TAG' must look like v0.12.0 or v0.12.0-beta.1."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists. Choose the next number."
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Check the tag's branch
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eu
          git fetch --no-tags origin main develop
          on_branch() { git merge-base --is-ancestor "$GITHUB_SHA" "origin/$1" 2>/dev/null; }
          case "$TAG" in
            *-*)
              # A beta is cut from develop; main is accepted for a pre-release of a hotfix.
              if ! on_branch develop && ! on_branch main; then
                echo "::error::Pre-release $TAG must point to a commit on develop or main."
                exit 1
              fi
              ;;
            *)
              if ! on_branch main; then
                echo "::error::Release $TAG must point to a commit on main. Merge develop into main first."
                exit 1
              fi
              ;;
          esac
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./...
      - name: Build static ARMv7 binary
        env:
          VERSION: ${{ steps.meta.outputs.tag }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p dist
          GIT_SHA="$(git rev-parse --short=7 "$GITHUB_SHA")"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -buildvcs=false -trimpath \
            -ldflags "-s -w -X bticino-go-companion/internal/system.BuildVersion=${VERSION} -X bticino-go-companion/internal/system.BuildGitSHA=${GIT_SHA} -X bticino-go-companion/internal/system.BuildReleaseRepo=${RELEASE_REPO}" \
            -o dist/companion ./cmd/companion
      - name: Package release bundle
        run: |
          set -eu
          mkdir -p dist/bundle/companion/init.d
          cp dist/companion dist/bundle/companion/companion
          cp scripts/init.d/companion dist/bundle/companion/init.d/companion
          cp -a gst dist/bundle/companion/gst
          chmod 755 dist/bundle/companion/companion dist/bundle/companion/init.d/companion
          tar -C dist/bundle -czf dist/companion.tar.gz companion
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          # Pushed only after the tests and the build pass, so a failed run leaves no tag behind.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" -m "Created by $ACTOR from $GITHUB_REF_NAME." "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/companion.tar.gz
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          body: |
            ## Install

            ```sh
            curl -fsSL -o /tmp/install.sh "https://github.com/${{ github.repository }}/raw/main/scripts/install.sh" && COMPANION_RELEASE_TAG=${{ steps.meta.outputs.tag }} sh /tmp/install.sh
            ```
          generate_release_notes: true

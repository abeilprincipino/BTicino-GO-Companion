name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build release binary
        env:
          VERSION: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p dist
          GIT_SHA="$(git rev-parse --short=7 "$GITHUB_SHA")"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
            go build \
            -buildvcs=false \
            -trimpath \
            -ldflags "-s -w -X bticino-go-companion/internal/config.BuildVersion=${VERSION} -X bticino-go-companion/internal/config.BuildGitSHA=${GIT_SHA} -X bticino-go-companion/internal/config.BuildDate=${BUILD_DATE} -X bticino-go-companion/internal/config.BuildReleaseRepo=${RELEASE_REPO}" \
            -o dist/companion \
            ./cmd/companion

          sha256sum dist/companion > dist/companion.sha256

      - name: Build install bundle
        run: |
          set -eu
          rm -rf dist/companion-bundle
          mkdir -p dist/companion-bundle/companion/init.d
          cp scripts/install.sh dist/companion-bundle/companion/install.sh
          cp scripts/init.d/companion dist/companion-bundle/companion/init.d/companion
          cp dist/companion dist/companion-bundle/companion/companion
          cp -a gst dist/companion-bundle/companion/gst
          chmod 755 dist/companion-bundle/companion/install.sh dist/companion-bundle/companion/init.d/companion dist/companion-bundle/companion/companion
          tar -C dist/companion-bundle -czf dist/companion.tar.gz companion

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bticino-go-companion-${{ github.ref_name }}
          path: |
            dist/companion.sha256
            dist/companion.tar.gz

      - name: Prepare release body
        run: |
          set -eu
          REPO="${GITHUB_REPOSITORY}"
          cat > /tmp/release-notes.md <<EOF
          ## Install

          ### 1) Download installer

          \`\`\`sh
          wget -qO /tmp/install.sh "https://raw.githubusercontent.com/${REPO}/main/scripts/install.sh"
          \`\`\`

          ### 2) Run installer

          \`\`\`sh
          sh /tmp/install.sh
          \`\`\`
          EOF

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/companion.sha256
            dist/companion.tar.gz
          body_path: /tmp/release-notes.md
          append_body: true
          generate_release_notes: true
